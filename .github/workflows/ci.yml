name: CinemaSeat CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  # Person 1: seat-domain correctness
  seat-domain:
    name: Person 1 - Seat Domain
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run seat-domain tests
        run: php artisan test --filter="Seat"

  # Reserved for Person 2 / 3.
  external-integration:
    name: Person 2/3 - Gateway / External Integration
    if: ${{ false }}
    runs-on: ubuntu-latest

    steps:
      - name: Placeholder
        run: echo "External integration tests are not enabled yet."
